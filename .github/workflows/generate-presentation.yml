name: Generate weekly offer presentation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 4"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python src/offer_automation.py
      - uses: actions/upload-artifact@v4
        with:
          name: tilbudsoversigt
          path: output/
          if-no-files-found: error
          retention-days: 30
